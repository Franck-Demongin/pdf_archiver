name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --release

      - name: Build release
        run: cargo build --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf_archiver-windows-x86_64
          path: target/release/pdf_archiver.exe

      - name: Compute SHA256
        id: sha256
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 target/release/pdf_archiver.exe).Hash
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/pdf_archiver.exe
          body: |
            Windows build (`x86_64-pc-windows-msvc`).

            SHA256: `${{ steps.sha256.outputs.hash }}`
          generate_release_notes: true
